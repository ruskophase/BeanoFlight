[metadata]
name = beanoflight
version = 0.1.0
description = Metric bean detection, tracking, flight prediction and review tools
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.23
    opencv-python-headless>=4.8
    Pillow>=9
    lz4>=4
    pyzmq>=25

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    beano-flight = beanoflight.cli:main
    beano-registry = beanoflight.registry_service:main
    beano-registry-monitor = beanoflight.registry_monitor_app:main
    beano-mock-inferencer = beanoflight.mock_inferencer_app:main
    beano-inferencer = beanoflight.mock_inferencer_app:main
    beano-sorter = beanoflight.sorter_app:main
    beano-actuator = beanoflight.actuator_app:main
    beano-simulation = beanoflight.simulation_launcher_app:main
    beano-system-test = beanoflight.system_test:main
    beano-performance-benchmark = beanoflight.performance_benchmark:main
